---
name: Test examples/default

on:
  pull_request:
    branches: [main]
    paths:
      - 'examples/default/**'
      - '**/*.tf'
      - '.github/workflows/test-default-example.yml'
  push:
    branches: [main]
    paths:
      - 'examples/default/**'
      - '**/*.tf'
      - '.github/workflows/test-default-example.yml'
  workflow_dispatch:
    inputs:
      skip_destroy:
        description: 'Skip destroy step (leave resources running). USE WITH CAUTION.'
        type: boolean
        default: false
        required: false

# Serialize runs so multiple PRs/pushes don't collide on Azure quota / naming.
concurrency:
  group: test-default-example
  cancel-in-progress: false

permissions:
  id-token: write   # required for OIDC azure/login
  contents: read
  pull-requests: write

env:
  TF_IN_AUTOMATION: '1'
  TF_INPUT: '0'
  TF_VAR_enable_telemetry: 'false'
  ARM_USE_OIDC: 'true'
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  EXAMPLE_DIR: examples/default

jobs:
  lint:
    name: fmt + validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: '1.9.8'
          terraform_wrapper: false

      - name: terraform fmt (recursive, check)
        run: terraform fmt -check -recursive

      - name: terraform init (example, no backend)
        working-directory: ${{ env.EXAMPLE_DIR }}
        run: terraform init -backend=false

      - name: terraform validate (example)
        working-directory: ${{ env.EXAMPLE_DIR }}
        run: terraform validate

  deploy:
    name: plan + apply + destroy
    needs: lint
    runs-on: ubuntu-latest
    # 'test' environment lets you require manual approval before real Azure deploys.
    # Create the environment in GitHub repo settings if you want that gate.
    environment: test
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: '1.9.8'
          terraform_wrapper: false

      - name: Azure login (OIDC)
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: terraform init
        working-directory: ${{ env.EXAMPLE_DIR }}
        run: terraform init -upgrade

      - name: terraform plan
        working-directory: ${{ env.EXAMPLE_DIR }}
        run: terraform plan -out=tfplan -lock-timeout=10m

      - name: terraform apply
        id: apply
        working-directory: ${{ env.EXAMPLE_DIR }}
        run: terraform apply -auto-approve -lock-timeout=10m tfplan

      - name: terraform destroy
        # Always attempt destroy (even on apply failure) unless the operator opted out.
        if: ${{ always() && inputs.skip_destroy != true }}
        working-directory: ${{ env.EXAMPLE_DIR }}
        run: terraform destroy -auto-approve -lock-timeout=10m

      - name: Warn if destroy skipped
        if: ${{ inputs.skip_destroy == true }}
        run: |
          echo "::warning::skip_destroy=true was set. Azure resources from examples/default are still running. Remember to clean them up manually."
