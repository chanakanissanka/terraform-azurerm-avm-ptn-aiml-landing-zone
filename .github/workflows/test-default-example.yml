---
name: Test examples/default

on:
  pull_request:
    branches: [main]
    paths:
      - 'examples/default/**'
      - '**/*.tf'
      - '.github/workflows/test-default-example.yml'
  push:
    branches: [main]
    paths:
      - 'examples/default/**'
      - '**/*.tf'
      - '.github/workflows/test-default-example.yml'
  workflow_dispatch:
    inputs:
      skip_destroy:
        description: 'Skip the destroy job entirely (leave resources running). Bypasses the approval gate.'
        type: boolean
        default: false
        required: false

# Serialize runs so multiple PRs/pushes don't collide on Azure quota / naming.
concurrency:
  group: test-default-example
  cancel-in-progress: false

permissions:
  id-token: write   # required for OIDC azure/login
  contents: read
  pull-requests: write

env:
  TF_IN_AUTOMATION: '1'
  TF_INPUT: '0'
  TF_VAR_enable_telemetry: 'false'
  ARM_USE_OIDC: 'true'
  ARM_USE_AZUREAD: 'true'   # use AAD auth (not access keys) for the azurerm backend
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  EXAMPLE_DIR: examples/default

jobs:
  lint:
    name: fmt + validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: '1.12.2'
          terraform_wrapper: false

      - name: terraform fmt (recursive, check)
        run: terraform fmt -check -recursive

      - name: terraform init (example, no backend)
        working-directory: ${{ env.EXAMPLE_DIR }}
        run: terraform init -backend=false

      - name: terraform validate (example)
        working-directory: ${{ env.EXAMPLE_DIR }}
        run: terraform validate

  deploy:
    name: plan + apply
    needs: lint
    runs-on: ubuntu-latest
    # 'test' environment lets you require manual approval before real Azure deploys.
    # Create the environment in GitHub repo settings if you want that gate.
    environment: test
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: '1.12.2'
          terraform_wrapper: false

      - name: Azure login (OIDC)
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: terraform init
        id: init
        working-directory: ${{ env.EXAMPLE_DIR }}
        run: |
          terraform init -upgrade -reconfigure \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TFSTATE_CONTAINER }}" \
            -backend-config="key=examples/default.tfstate"

      - name: terraform plan
        working-directory: ${{ env.EXAMPLE_DIR }}
        run: terraform plan -out=tfplan -lock-timeout=10m

      - name: terraform apply
        id: apply
        working-directory: ${{ env.EXAMPLE_DIR }}
        run: terraform apply -auto-approve -lock-timeout=10m tfplan

      - name: Summary
        if: ${{ always() }}
        run: |
          echo "### Deploy result: ${{ steps.apply.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ inputs.skip_destroy }}" == "true" ]]; then
            echo ":warning: \`skip_destroy=true\` was set on this run. The \`destroy\` job will be **skipped** and resources will remain in Azure." >> "$GITHUB_STEP_SUMMARY"
          else
            echo ":hourglass: The \`destroy\` job will wait for a manual approval in the **destroy-approval** environment. Approve to tear down, reject to keep resources." >> "$GITHUB_STEP_SUMMARY"
          fi

  destroy:
    name: destroy (manual approval)
    needs: deploy
    # Runs after deploy (success or failure) so partial deployments can be cleaned up.
    # Skipped only when:
    #   - the operator explicitly opted out via `skip_destroy=true` on workflow_dispatch
    #   - the deploy job was itself skipped (e.g. lint failed)
    if: ${{ always() && needs.deploy.result != 'skipped' && inputs.skip_destroy != true }}
    runs-on: ubuntu-latest
    # 'destroy-approval' environment must have required reviewers configured in
    # GitHub repo settings -> Environments. The job pauses here until a reviewer
    # approves or rejects.
    environment: destroy-approval
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: '1.12.2'
          terraform_wrapper: false

      - name: Azure login (OIDC)
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: terraform init
        working-directory: ${{ env.EXAMPLE_DIR }}
        run: |
          terraform init -reconfigure \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TFSTATE_CONTAINER }}" \
            -backend-config="key=examples/default.tfstate"

      - name: terraform destroy
        working-directory: ${{ env.EXAMPLE_DIR }}
        run: terraform destroy -auto-approve -lock-timeout=10m

  destroy_skipped_notice:
    name: destroy skipped
    needs: deploy
    if: ${{ always() && needs.deploy.result != 'skipped' && inputs.skip_destroy == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Warn
        run: |
          echo "::warning::skip_destroy=true was set. Azure resources from examples/default are still running. Trigger this workflow again with skip_destroy=false (or run 'terraform destroy' manually) to clean up."
